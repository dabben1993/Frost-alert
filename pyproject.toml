[project]
name = "frost-alert"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "tzdata>=2026.4",
]

[project.scripts]
frost-alert = "frost_alert.entrypoints.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/frost_alert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
